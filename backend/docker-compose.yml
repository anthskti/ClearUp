# Local Postgres only. Run the API on the host with `npm run dev` (not in this file).
# Start:  docker compose up -d
# Stop:   docker compose down
# Shell:  docker exec -it skincare-db psql -U postgres -d skincare

services:
  postgres:
    image: postgres:15
    container_name: skincare-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: skincare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skincare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
